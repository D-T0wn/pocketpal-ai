
name: Build Unsigned iOS IPA

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-26
    timeout-minutes: 180
    env:
      NODE_OPTIONS: --max-old-space-size=8192
      CI: 'true'
      PLUS_STORE_GATE: 'false'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app
          xcodebuild -version

      - name: Ensure Metal compiler is available
        run: |
          xcrun -sdk iphoneos metal -v || xcodebuild -downloadComponent MetalToolchain
          xcrun -sdk iphoneos metal -v

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.21.0'
          cache: yarn

      - name: Install Yarn Classic
        run: npm install --global yarn@1.22.22

      - name: Install JavaScript dependencies
        run: yarn install --frozen-lockfile

      - name: Restore enriched-markdown native assets
        run: INIT_CWD="$GITHUB_WORKSPACE" node node_modules/react-native-enriched-markdown/postinstall.mjs

      - name: Set up Ruby and Bundler
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2.3'
          bundler-cache: true

      - name: Create local build configuration
        run: |
          mkdir -p ios/Config
          cat > ios/Config/Env.xcconfig <<'CONFIG'
          // Local unsigned build: external service identifiers not configured.
          GOOGLE_WEB_CLIENT_ID =
          REVERSED_GOOGLE_IOS_CLIENT_ID =
          CONFIG
          cat > .env <<'ENVFILE'
          APP_URL=pocketpal://app
          ENABLE_PALSHUB_INTEGRATION=false
          ENABLE_AUTHENTICATION=false
          ENABLE_OFFLINE_MODE=true
          ENVFILE

      - name: Install CocoaPods dependencies
        working-directory: ios
        run: pod install

      - name: Build unsigned iOS archive
        run: |
          set -o pipefail
          xcodebuild archive \
            -workspace ios/PocketPal.xcworkspace \
            -scheme PocketPal \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/PocketPal.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=''

      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/PocketPal.xcarchive/Products/Applications/PocketPal.app"
          test -d "$APP"
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP" "$RUNNER_TEMP/ipa/Payload/"
          cd "$RUNNER_TEMP/ipa"
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent Payload "$RUNNER_TEMP/PocketPal-unsigned.ipa"
          ls -lh "$RUNNER_TEMP/PocketPal-unsigned.ipa"

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v4
        with:
          name: PocketPal-unsigned-ipa
          path: ${{ runner.temp }}/PocketPal-unsigned.ipa
          if-no-files-found: error
          retention-days: 7
